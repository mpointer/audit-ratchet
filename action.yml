name: audit-ratchet
description: Fail a PR when a mutation handler lacks a namespaced audit write, or when the committed baseline of known-unaudited handlers grows.
branding: { icon: lock, color: gray-dark }
inputs:
  config:
    description: Path to audit-ratchet.json
    default: audit-ratchet.json
  base-ref:
    description: Base git ref for the growth check. Leave empty to skip it (for example on push events).
    default: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
  version:
    description: audit-ratchet version to run
    default: "0.1.0"
# --prefix keeps npx from resolving against the caller's package.json: a
# project that is itself named audit-ratchet (this repo) or that pins
# another version would otherwise not get the version asked for.
runs:
  using: composite
  steps:
    - name: Check coverage against the baseline
      shell: bash
      env: { CFG: "${{ inputs.config }}", VER: "${{ inputs.version }}" }
      run: mkdir -p "$RUNNER_TEMP/audit-ratchet" && npx --yes --prefix "$RUNNER_TEMP/audit-ratchet" "audit-ratchet@$VER" check --config "$CFG"
    - name: Baseline must not grow
      if: inputs.base-ref != ''
      shell: bash
      env: { CFG: "${{ inputs.config }}", VER: "${{ inputs.version }}", BASE: "${{ inputs.base-ref }}" }
      run: mkdir -p "$RUNNER_TEMP/audit-ratchet" && npx --yes --prefix "$RUNNER_TEMP/audit-ratchet" "audit-ratchet@$VER" growth --config "$CFG" --base "$BASE"
