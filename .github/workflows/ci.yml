name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
  self-check:
    # The package runs its own ratchet on its test fixture twice: from this
    # checkout via bin/, and through the composite action. The action runs
    # the latest npm release, so that step tests the action's plumbing, not
    # this commit's code. Not action.yml's pinned default: on a release PR
    # that version is not published yet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node bin/audit-ratchet.js check --config example/audit-ratchet.json
        working-directory: .
      - run: node bin/audit-ratchet.js growth --config example/audit-ratchet.json --base "origin/${{ github.base_ref }}"
        if: github.event_name == 'pull_request'
      - uses: ./
        with:
          config: example/audit-ratchet.json
          version: latest
