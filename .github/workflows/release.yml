name: Release
on:
  push:
    tags: ["v[0-9]*", "[0-9]*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          [ "$tag" = "$ver" ] || { echo "tag $tag != package.json $ver"; exit 1; }
          grep -q "default: \"$ver\"" action.yml || { echo "action.yml version default != $ver"; exit 1; }
      - name: Skip when this version is already on npm (the first release is published by hand)
        id: npm_exists
        run: |
          ver="$(node -p "require('./package.json').version")"
          if npm view "audit-ratchet@$ver" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "audit-ratchet@$ver is already published; skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm_exists.outputs.exists != 'true'
        run: npm publish --provenance --access public
